version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1.3

jobs:
  smoke-test:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Checkout code
          command: |
            git clone --filter=blob:none https://github.com/Intertrode/tps-report.git .
            git checkout "${CIRCLE_SHA1}"
      - run:
          name: Verify Environment & VCS Connection
          command: |
            echo "=============================================="
            echo "CircleCI VCS Connection Verified!"
            echo "Repository: Intertrode/tps-report"
            echo "Branch:     ${CIRCLE_BRANCH}"
            echo "Commit:     ${CIRCLE_SHA1}"
            echo "==============================================="

  test-integration:
    docker:
      - image: cimg/go:1.26
        environment:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: circleci
          DB_PASSWORD: circleci
          DB_NAME: tps_report_test
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: circleci
          POSTGRES_PASSWORD: circleci
          POSTGRES_DB: tps_report_test
    steps:
      - run:
          name: Checkout code
          command: |
            git clone --filter=blob:none https://github.com/Intertrode/tps-report.git .
            git checkout "${CIRCLE_SHA1}"
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "src/go.sum" }}
      - run:
          name: Download Go modules
          command: |
            cd src
            go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "src/go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
      - run:
          name: Wait for Postgres sidecar
          command: ./scripts/wait_for_db.sh 127.0.0.1 5432 60
      - run:
          name: Install gotestsum
          command: go install gotest.tools/gotestsum@latest
      - run:
          name: Run tests with gotestsum
          command: |
            mkdir -p test-results/go
            cd src
            gotestsum --junitfile ../test-results/go/junit.xml -- -v ./...
      - store_test_results:
          path: test-results

  build-docker-image:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Checkout code
          command: |
            git clone --filter=blob:none https://github.com/Intertrode/tps-report.git .
            git checkout "${CIRCLE_SHA1}"
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t tps-report:${CIRCLE_SHA1} .
      - run:
          name: Container smoke test (Postgres + app on a Docker network)
          command: |
            docker network create smoke-net

            docker run -d --name pg --network smoke-net \
              -e POSTGRES_USER=circleci \
              -e POSTGRES_PASSWORD=circleci \
              -e POSTGRES_DB=tps_report_smoke \
              postgres:16

            echo "Waiting for Postgres..."
            for i in $(seq 1 30); do
              if docker exec pg pg_isready -U circleci >/dev/null 2>&1; then
                echo "Postgres ready after ${i}s"
                break
              fi
              sleep 1
            done

            docker run -d --name app --network smoke-net \
              -e DB_HOST=pg -e DB_PORT=5432 \
              -e DB_USER=circleci -e DB_PASSWORD=circleci -e DB_NAME=tps_report_smoke \
              -e PORT=8080 \
              tps-report:${CIRCLE_SHA1}

            echo "Waiting for app..."
            for i in $(seq 1 30); do
              if docker run --rm --network smoke-net curlimages/curl:latest \
                   curl -sf http://app:8080/healthz >/dev/null 2>&1; then
                echo "App healthy after ${i}s:"
                docker run --rm --network smoke-net curlimages/curl:latest \
                  curl -sf http://app:8080/healthz
                exit 0
              fi
              sleep 1
            done

            echo "App did not become healthy in time" >&2
            docker logs app || true
            exit 1
      - run:
          name: Save image for publish job
          command: |
            mkdir -p /tmp/workspace
            docker save tps-report:${CIRCLE_SHA1} -o /tmp/workspace/image.tar
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - image.tar

  publish-to-ecr:
    docker:
      - image: cimg/base:current
        environment:
          AWS_DEFAULT_REGION: us-east-1
    steps:
      - run:
          name: Checkout code
          command: |
            git clone --filter=blob:none https://github.com/Intertrode/tps-report.git .
            git checkout "${CIRCLE_SHA1}"
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker
      - run:
          name: Load image built in build-docker-image
          command: docker load -i /tmp/workspace/image.tar
      - aws-cli/setup:
          role-arn: ${AWS_ROLE_ARN}
          role-session-name: circleci-tps-report-publish
      - run:
          name: Push to Amazon ECR via OIDC (no static AWS keys)
          command: |
            aws ecr get-login-password --region us-east-1 \
              | docker login --username AWS --password-stdin 916028337694.dkr.ecr.us-east-1.amazonaws.com

            docker tag tps-report:${CIRCLE_SHA1} \
              916028337694.dkr.ecr.us-east-1.amazonaws.com/tps-report:${CIRCLE_SHA1}
            docker tag tps-report:${CIRCLE_SHA1} \
              916028337694.dkr.ecr.us-east-1.amazonaws.com/tps-report:latest

            docker push 916028337694.dkr.ecr.us-east-1.amazonaws.com/tps-report:${CIRCLE_SHA1}
            docker push 916028337694.dkr.ecr.us-east-1.amazonaws.com/tps-report:latest

workflows:
  baseline-verification:
    jobs:
      - smoke-test
      - test-integration
      - build-docker-image:
          requires:
            - test-integration
      - publish-to-ecr:
          requires:
            - build-docker-image
          context: aws-ecr-publish
          filters:
            branches:
              only: main
